name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Ein neuer Push auf denselben Branch macht den vorherigen Lauf überflüssig.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typen, Build und Sicherheit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Geteiltes Paket bauen
        # Muss zuerst gebaut werden: API und Web greifen auf dessen Typen zu.
        run: npm run build -w @manager/shared

      - name: Typen prüfen
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Bauen
        run: npm run build

      - name: Sicherheitsprüfung
        # Prüft Laufzeit-Abhängigkeiten gegen die begründete Ausnahmeliste
        # in security-exceptions.json.
        run: npm run audit

      - name: Migrationen sind aktuell
        # Verhindert den häufigsten Fehler bei Schema-Änderungen: Schema
        # angepasst, aber die SQL-Migration vergessen zu erzeugen.
        run: |
          npm run db:generate -w @manager/api
          if ! git diff --quiet -- apps/api/drizzle; then
            echo "Das Datenbankschema wurde geändert, ohne eine Migration zu erzeugen."
            echo "Bitte lokal ausführen:  npm run db:generate -w @manager/api"
            git diff --stat -- apps/api/drizzle
            exit 1
          fi

  container:
    name: Container-Image baut
    runs-on: ubuntu-latest
    # Baut das Image auf jedem Branch, ohne es zu veröffentlichen. So fällt ein
    # Fehler im Dockerfile hier auf und nicht erst beim Deploy auf das NAS.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image bauen (ohne Push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          # Nur amd64: Der Multi-Arch-Build mit QEMU dauert deutlich länger und
          # ist beim Veröffentlichen auf main ohnehin abgedeckt.
          platforms: linux/amd64
          push: false
          load: true
          tags: manager-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container startet und antwortet
        # Der eigentliche Test: Migrationen laufen, der Server bindet den Port,
        # und /api/health liefert eine Antwort.
        run: |
          mkdir -p /tmp/manager-ci/data /tmp/manager-ci/storage
          docker run -d --name manager-ci \
            -p 8080:8080 \
            -e SESSION_SECRET="ci-secret-lang-genug-fuer-die-pruefung-32" \
            -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -v /tmp/manager-ci/data:/data \
            -v /tmp/manager-ci/storage:/storage \
            manager-api:ci

          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/health > /tmp/health.json; then
              echo "Antwort: $(cat /tmp/health.json)"
              docker rm -f manager-ci > /dev/null
              exit 0
            fi
            sleep 2
          done

          echo "Container antwortet nicht. Logs:"
          docker logs manager-ci
          docker rm -f manager-ci > /dev/null
          exit 1
