# ---------------------------------------------------------------------------
# Netlify – Frontend auf manager.alae.app
# ---------------------------------------------------------------------------

[build]
  # Vom Repo-Wurzelverzeichnis aus bauen, damit npm-Workspaces greifen
  # (das Frontend importiert Typen aus @manager/shared).
  command = "npm run build -w @manager/shared && npm run build -w @manager/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  # VITE_API_URL wird in den Netlify-Einstellungen gesetzt (siehe SETUP-QNAP.md).
  # Absichtlich nicht hier: Änderungen sollen kein Commit brauchen.

# ---------------------------------------------------------------------------
# Zwei Apps auf einer Adresse
#
# Manager (/app) und DocBase (/docbase) sind zwei eigenständige PWAs: je ein
# Manifest, ein Service Worker, ein Geltungsbereich.
#
# Beide liegen bewusst in einem Unterordner, keine von beiden auf `/`. Solange
# der Manager die Wurzel für sich beanspruchte, lag die DocBase innerhalb
# seines Geltungsbereichs – Android hielt sie deshalb für dieselbe, bereits
# installierte App und bot sie gar nicht erst zur Installation an. Verschachtelt
# geht es nicht, nebeneinander schon.
#
# Die Reihenfolge dieser Regeln ist entscheidend: Netlify nimmt die erste, die
# passt. Stünde die Sammelregel unten weiter oben, bekäme /docbase die Hülle
# des Managers – und man tippt auf DocBase und landet im Haushalt.
# ---------------------------------------------------------------------------

# Ohne Schrägstrich am Ende liegt die Adresse ausserhalb des Geltungsbereichs
# der jeweiligen App. Ein Browser, der sie so öffnet, hielte sie für eine
# fremde Seite und böte die Installation nicht an.
[[redirects]]
  from = "/docbase"
  to = "/docbase/"
  status = 301

[[redirects]]
  from = "/docbase/*"
  to = "/docbase/index.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301

[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# Die Wurzel gehört keiner App mehr und führt zum Manager – wer die Adresse
# ohne Zusatz eintippt, landet dort, wo er vorher landete.
[[redirects]]
  from = "/"
  to = "/app/"
  status = 301

# Alles Übrige stammt aus der Zeit, als der Manager auf `/` lag: alte
# Lesezeichen, alte Verknüpfungen, der Startpunkt einer alten Installation.
# Sie behalten ihren Pfad und bekommen nur das Präfix davor.
#
# Dateien, die es wirklich gibt, gehen vor: `/sw.js` liegt im Ausgabeordner und
# wird weiterhin ausgeliefert, statt hier umgeleitet zu werden. Das ist
# entscheidend – auf eine Umleitung hin behielte der Browser den alten Service
# Worker für immer (siehe apps/web/legacy-root/sw.js).
[[redirects]]
  from = "/*"
  to = "/app/:splat"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # camera=(self) ist für den Dokumentenmodus nötig: Er zeigt das Kamerabild
    # live in der Seite (getUserMedia), um die Ränder des Blattes zu finden.
    # Ohne diese Freigabe lehnt der Browser den Zugriff ab, bevor überhaupt
    # jemand gefragt wird. Der Weg über die Kamera-App des Systems käme auch
    # ohne aus – nur kann die App dort nicht zuschneiden.
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), interest-cohort=()"
    # img-src erlaubt bewusst kein https://manager-api.alae.app: Die Vorschau
    # holt Bilder und gerasterte PDF-Seiten per fetch() – dafür genügt der
    # Eintrag unter connect-src – und zeigt sie als blob: an. Ein <img> direkt
    # auf die API-Adresse wäre hier verworfen worden, und genau das war die
    # Ursache der leeren Vorschau. object-src 'none', weil kein <object> und
    # kein <embed> mehr vorkommt; PDFs werden als Bild dargestellt.
    #
    # connect-src kennt bewusst kein blob:. Wer die Bytes eines angezeigten
    # Bildes braucht – etwa das Zuschneiden –, nimmt den Blob, den die App
    # ohnehin im Speicher hält, und nicht seine Adresse: Ein fetch() darauf
    # wird hier verworfen, und der Browser meldet dazu nur „Failed to fetch".
    # Das war genau der Fehler beim Speichern eines Zuschnitts. Die Richtlinie
    # dafür zu öffnen wäre die falsche Richtung gewesen – die Daten lagen
    # bereits vor, geholt wurden sie ein zweites Mal.
    Content-Security-Policy = """
      default-src 'self'; \
      script-src 'self'; \
      style-src 'self' 'unsafe-inline'; \
      img-src 'self' data: blob:; \
      font-src 'self'; \
      connect-src 'self' https://manager-api.alae.app; \
      object-src 'none'; \
      frame-ancestors 'none'; \
      base-uri 'self'; \
      form-action 'self'"""

# Der Service Worker darf nie aus dem Cache kommen – sonst bleibt eine alte
# App-Version hängen, obwohl Netlify längst neu deployt hat.
[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

# Der Abmelde-Worker an der alten Adresse. Dieselbe Regel und aus demselben
# Grund: Ein zwischengespeicherter alter Worker meldete sich nie ab.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Dasselbe für die DocBase: eigener Worker, eigenes Manifest, dieselbe Regel.
[[headers]]
  for = "/docbase/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/docbase/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

# Gehashte Dateinamen ändern sich bei jeder Änderung – die dürfen ewig cachen.
[[headers]]
  for = "/app/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/docbase/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
