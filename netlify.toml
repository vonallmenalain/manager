# ---------------------------------------------------------------------------
# Netlify – Frontend auf manager.alae.app
# ---------------------------------------------------------------------------

[build]
  # Vom Repo-Wurzelverzeichnis aus bauen, damit npm-Workspaces greifen
  # (das Frontend importiert Typen aus @manager/shared).
  command = "npm run build -w @manager/shared && npm run build -w @manager/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  # VITE_API_URL wird in den Netlify-Einstellungen gesetzt (siehe SETUP-QNAP.md).
  # Absichtlich nicht hier: Änderungen sollen kein Commit brauchen.

# Single-Page-App: Alle Pfade liefern index.html, das Routing macht der Browser.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Bleibt auch mit der Kamera-Aufnahme aus Etappe 2 unverändert: Das
    # capture-Attribut öffnet die Kamera-App des Systems und braucht keine
    # Berechtigung der Seite. Nötig würde 'camera=(self)' erst bei einer
    # Live-Vorschau im Browser über getUserMedia.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = """
      default-src 'self'; \
      script-src 'self'; \
      style-src 'self' 'unsafe-inline'; \
      img-src 'self' data: blob:; \
      font-src 'self'; \
      connect-src 'self' https://manager-api.alae.app; \
      frame-ancestors 'none'; \
      base-uri 'self'; \
      form-action 'self'"""

# Der Service Worker darf nie aus dem Cache kommen – sonst bleibt eine alte
# App-Version hängen, obwohl Netlify längst neu deployt hat.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

# Gehashte Dateinamen ändern sich bei jeder Änderung – die dürfen ewig cachen.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
